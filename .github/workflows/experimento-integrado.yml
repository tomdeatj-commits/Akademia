name: Experimento integrado 3-PG e fenotipagem
on:
  push:
    branches:
      - 'feature/**'
  pull_request:
permissions:
  contents: read
jobs:
  experimento-integrado:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependências do motor existente
        run: python3 -m pip install numpy pandas
      - name: Executar testes sintéticos do orquestrador integrado
        run: python3 -m unittest discover -s experimentos/integrado -p 'test_cenarios_integrados.py' -v
      - name: Verificar sintaxe de scripts de entrada
        run: python3 -m py_compile experimentos/integrado/cenarios.py experimentos/integrado/executar.py
